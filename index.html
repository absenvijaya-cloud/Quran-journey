<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Quran Journey</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FAF7F1">
<meta name="description" content="Baca dan dengarkan Al-Qur'an, catat ibadah, dan lihat jadwal salat dengan tenang.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quran Journey">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app">

  <!-- Pembuka -->
  <div id="splash" class="splash" role="presentation">
    <div class="splash-glow"></div>
    <svg class="splash-svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <path class="drawn" d="M95 600 L95 360 Q95 200 195 160 Q295 200 295 360 L295 600" fill="none" stroke="#D4B27A" stroke-width="1.5"/>
      <path class="drawn2" d="M122 600 L122 372 Q122 236 195 204 Q268 236 268 372 L268 600" fill="none" stroke="#8B6F47" stroke-width="1" opacity=".55"/>
      <g class="splash-moon">
        <mask id="cm"><rect x="150" y="285" width="90" height="90" fill="#fff"/><circle cx="207" cy="324" r="26" fill="#000"/></mask>
        <circle cx="190" cy="330" r="30" fill="#D4B27A" mask="url(#cm)"/>
      </g>
      <circle cx="232" cy="292" r="3" fill="#D4B27A" class="breathe"/>
      <circle cx="160" cy="262" r="2" fill="#A87935" class="breathe" style="animation-delay:.5s"/>
    </svg>
    <div class="splash-title">
      <div class="splash-name">Quran Journey</div>
      <div class="splash-tag">Lebih dekat dalam setiap langkah.</div>
    </div>
    <button id="splashSkip" class="splash-skip" type="button">Lewati</button>
    <div class="splash-hint">Sentuh layar untuk memercikkan cahaya</div>
  </div>

  <main id="view" class="view" tabindex="-1"></main>

  <div id="mini" class="mini" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <nav id="nav" class="nav" aria-label="Menu utama" hidden>
    <span class="nav-dot" id="navDot"></span>
    <a href="#/home" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20V11a7 7 0 0 1 14 0v9M9 20v-6a3 3 0 0 1 6 0v6"/></svg><span>Beranda</span></a>
    <a href="#/quran" data-tab="quran"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M20 17H6.5A2.5 2.5 0 0 0 4 19.5"/></svg><span>Al-Qur'an</span></a>
    <a href="#/kisah" data-tab="kisah"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v18l-5-3.5L7 21z"/><path d="M10 8h4"/></svg><span>Kisah</span></a>
    <a href="#/ibadah" data-tab="ibadah"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 11 3.5a6.5 6.5 0 0 0 9.5 11z"/></svg><span>Ibadah</span></a>
    <a href="#/kalender" data-tab="kalender"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg><span>Kalender</span></a>
  </nav>
</div>
<noscript>Aplikasi ini membutuhkan JavaScript.</noscript>

<script src="js/firebase-config.js"></script>
<script src="js/sync.js"></script>
<script src="js/core.js"></script>
<script src="js/adzan.js"></script>
<script src="js/app.js"></script>
</body>
</html>
